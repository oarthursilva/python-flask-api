ID: hbappl-api
_schema-version: "3.2"
version: 1.0.0

modules:
  - name: hbappl-api
    type: python
    path: ../cap/api/
    parameters:
      memory: 64M
      disk-quota: 512M
      host: hbappl-api
      domain: cfapps.br10.hana.ondemand.com
    provides:
      - name: srv_api
        properties:
          url: ${default-url}
    requires:
      - name: pyuaa

resources:
  - name: pyuaa
    parameters:
      path: ./xs-security.json
      service-plan: application
      service: xsuaa
    type: org.cloudfoundry.managed-service
